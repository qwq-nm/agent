services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/secagent.db
      DATA_DIR: /data
      MODEL_MODE: ${MODEL_MODE:-mock}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-30}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_BASE_URL: ${GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      GLM_MODEL: ${GLM_MODEL:-glm-5.2}
      WEB_ALLOWED_HOSTS: ${WEB_ALLOWED_HOSTS:-web-demo}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      ARCHIVE_MAX_FILES: ${ARCHIVE_MAX_FILES:-200}
      ARCHIVE_MAX_BYTES: ${ARCHIVE_MAX_BYTES:-52428800}
      MAX_STEPS_PER_TASK: ${MAX_STEPS_PER_TASK:-20}
      MAX_REPLANS: ${MAX_REPLANS:-2}
      TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS:-300}
    volumes:
      - secagent-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${SECAGENT_PORT:-18080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  web-demo:
    image: nginx:1.27-alpine
    volumes:
      - ./web-demo/html:/usr/share/nginx/html:ro
      - ./web-demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  secagent-data:
